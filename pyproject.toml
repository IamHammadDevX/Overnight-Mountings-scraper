[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overnight-scraper"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1", "requests>=2.31", "playwright>=1.58"]

[project.scripts]
overnight-scraper = "overnight_scraper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
